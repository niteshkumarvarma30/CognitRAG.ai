name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: 13.239.199.181
          username: ubuntu


          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd CognitRAG.ai
            git pull origin main
            sudo docker compose up -d --build
